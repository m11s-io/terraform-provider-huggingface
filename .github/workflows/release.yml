name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    uses: m11s-io/.github/.github/workflows/provider-release.yml@main
    with:
      runs_on: ubuntu-24.04
      goreleaser_version: v2.19.0
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
