name: OSV dependency scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '33 5 * * 2'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: osv-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: m11s-io/.github/.github/workflows/osv-scanner.yml@7a1ba709f0480c5ef581f3bc5a5f0a541f18783c
