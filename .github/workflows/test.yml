name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l main.go internal)"
      - run: make generate-check
      - run: go vet ./...
      - run: go test -race ./...
      - run: python3 -m unittest discover -s tests/acceptance -p "test_*.py"
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Install pinned Terraform for docs
        run: |
          python3 tests/acceptance/install_cli.py terraform "$RUNNER_TEMP/cli"
          echo "$RUNNER_TEMP/cli" >> "$GITHUB_PATH"
      - run: make docs-check
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: v2.19.0
          args: check
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: v2.19.0
          args: release --snapshot --clean --skip=publish,sign
  acceptance:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, tofu]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Install pinned Terraform or OpenTofu with checksum verification
        env:
          CLI: ${{ matrix.cli }}
        run: python3 tests/acceptance/install_cli.py "$CLI" "$RUNNER_TEMP/cli"
      - name: Run disposable acceptance suite
        env:
          TF_ACC_TERRAFORM_PATH: ${{ runner.temp }}/cli/${{ matrix.cli }}
        run: python3 tests/acceptance/run.py --publisher --cli "$TF_ACC_TERRAFORM_PATH"
